# Causal link dictionary. Every implemented link is referenced by ID in the engine and the trace.
# kind: identity (accounting/arithmetic), rule (explicit actor or institutional rule),
#       external (benchmarked to published estimate), judgmental, illustrative.
# Links with implemented: false are CONCEPTUAL GAPS shown in the causal map as dashed lines.
version: mech-0.3.0
links:
  - {id: M-OIL-01, src: [disrupt, esc, shock_oil_escalation, shock_oil_deescalation], dst: brent, kind: judgmental, lag: 0, implemented: true,
     desc: "Supply-disruption regime raises the Brent anchor; Brent mean-reverts toward it (faster in a regime-change month).",
     params: [oil_anchor, oil_disrupt_prem, oil_kappa], evidence: [E15, E16],
     counter: "SPR releases, OPEC+ spare capacity, demand destruction", invalid: "Brent stays elevated after the regime is declared over"}
  - {id: M-OIL-02, src: [gdem], dst: brent, kind: judgmental, lag: 0, implemented: true,
     desc: "Demand-driven oil move: weaker world demand lowers the anchor.", params: [oil_gdem_beta], evidence: [],
     counter: "Supply cuts in response to weak demand", invalid: "Oil and global activity decouple for long periods"}
  - {id: M-OIL-03, src: [disrupt, esc], dst: crack, kind: illustrative, lag: 0, implemented: true,
     desc: "Disruption widens product cracks and war-risk freight.", params: [crack_disrupt, freight_disrupt], evidence: [E21],
     counter: "Refinery reruns", invalid: "Cracks fall during disruption"}
  - {id: M-OIL-04, src: [esc], dst: shortfall, kind: illustrative, lag: 0, implemented: true,
